server:
  port: 8001
  servlet:
    encoding:
      enabled: true
      force: true
      charset: UTF-8
spring:
  application:
    name: check01
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  ai:
    dashscope:
      api-key: ${AI_DASHSCOPE_API_KEY}
  mvc:
    async:
      request-timeout: 600000

# 批量幻觉检测配置
hallucination:
  detect:
    model: deepseek                                 # 检测模型: qwen / deepseek
    sample-file: task4_replies.json             # 待检测样本（相对仓库根目录或绝对路径）
    ground-truth-file: task4_ground_truth.json  # 人工标注基准，缺失时跳过指标计算
    output-dir: output                          # 结果文件输出目录（相对仓库根目录）
    concurrency: 4                              # 并发检测数
    max-retries: 1                              # 单条样本失败重试次数
