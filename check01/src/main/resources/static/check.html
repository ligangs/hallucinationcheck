<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客服回复幻觉检测</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.8.1/github-markdown.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.11.0/styles/github.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #f5f7fa;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            padding: 12px;
        }
        .chat-wrap {
            max-width: 1000px;
            margin: 0 auto;
        }
        .chat-title {
            text-align: center;
            font-size: 20px;
            color: #222;
            margin-bottom: 16px;
        }
        .chat-box {
            min-height: 500px;
            max-height: 70vh;
            overflow-y: auto;
            background: #ffffff;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            margin-bottom: 12px;
        }
        .msg-item {
            margin-bottom: 16px;
        }
        .user-msg {
            display: flex;
            justify-content: flex-end;
        }
        .ai-msg {
            display: flex;
            justify-content: flex-start;
        }
        .msg-bubble-user {
            max-width: 75%;
            background-color: #1677ff;
            color: #fff;
            padding: 12px 16px;
            border-radius: 12px 12px 2px 12px;
            white-space: pre-wrap;
            word-break: break-word;
            overflow-wrap: anywhere;
            line-height: 1.6;
        }
        .msg-bubble-ai {
            max-width: 75%;
            background-color: #f7f8fa;
            color: #333;
            border-radius: 12px 12px 12px 2px;
            padding: 14px 18px;
            word-break: break-word;
            overflow-wrap: anywhere;
            line-height: 1.6;
        }
        .msg-bubble-ai .markdown-body {
            background: transparent !important;
            padding:0 !important;
        }
        .loading-text {
            color:#888;
        }
        .batch-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .batch-bar button {
            padding: 8px 16px;
            font-size: 14px;
        }
        /* 批量检测按钮加载态：白圈旋转 + 禁用视觉 */
        #batchBtn.is-loading {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        #batchBtn.is-loading::before {
            content: "";
            width: 12px;
            height: 12px;
            border: 2px solid rgba(255, 255, 255, 0.45);
            border-top-color: #fff;
            border-radius: 50%;
            flex: none;
            animation: batchSpin 0.8s linear infinite;
        }
        @keyframes batchSpin {
            to {
                transform: rotate(360deg);
            }
        }
        .batch-status {
            color: #666;
            font-size: 13px;
        }
        .result-link {
            color: #1677ff;
            font-size: 13px;
            text-decoration: none;
            margin-left: auto;
        }
        /* ===== 批量检测汇总报告 ===== */
        .msg-bubble-ai.summary-report {
            max-width: 100%;
            width: 100%;
            background: #ffffff;
            border: 1px solid #e5e6eb;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            padding: 18px 20px;
        }
        .markdown-body.summary-report table.ov-table {
            display: table;
            width: 100%;
            max-width: none;
            min-width: 0;
            table-layout: auto;
            border-collapse: collapse;
            font-size: 13px;
            margin: 0;
            overflow: visible;
        }
        .markdown-body.summary-report table.ov-table td:nth-child(odd) {
            color: #8c8c8c;
            background-color: #fafbfc;
        }
        .markdown-body.summary-report table.ov-table td:nth-child(even) {
            color: #333;
            font-weight: 600;
        }
        .markdown-body.summary-report table.ov-table td.val-hall {
            color: #cf1322;
        }
        .markdown-body.summary-report table.ov-table td.val-ok {
            color: #389e0d;
        }
        .markdown-body.summary-report table.ov-table td.val-p0 {
            color: #cf1322;
        }
        .markdown-body.summary-report table.ov-table td.val-p1 {
            color: #d46b08;
        }
        .markdown-body.summary-report table.ov-table td.val-p2 {
            color: #0958d9;
        }
        .markdown-body.summary-report .table-scroll {
            overflow-x: auto;
            margin: 6px 0 10px;
            border: 1px solid #e5e6eb;
            border-radius: 8px;
        }
        .markdown-body.summary-report table.rt-table {
            display: table;
            width: 100%;
            max-width: none;
            min-width: 720px;
            table-layout: fixed;
            border-collapse: collapse;
            font-size: 13px;
            margin: 0;
            overflow: visible;
        }
        .markdown-body.summary-report th,
        .markdown-body.summary-report td {
            padding: 7px 10px;
            border: none;
            border-bottom: 1px solid #e5e6eb;
            border-right: 1px solid #f0f1f3;
            text-align: left;
            vertical-align: top;
            word-break: break-word;
            overflow-wrap: anywhere;
            line-height: 1.6;
        }
        .markdown-body.summary-report th:last-child,
        .markdown-body.summary-report td:last-child {
            border-right: none;
        }
        .markdown-body.summary-report tbody tr:last-child td {
            border-bottom: none;
        }
        .markdown-body.summary-report th {
            background: #f7f8fa;
            font-weight: 600;
            color: #333;
            white-space: nowrap;
        }
        .markdown-body.summary-report table.rt-table th:nth-child(1) { width: 64px; }
        .markdown-body.summary-report table.rt-table th:nth-child(2) { width: 22%; }
        .markdown-body.summary-report table.rt-table th:nth-child(3) { width: 76px; }
        .markdown-body.summary-report table.rt-table th:nth-child(4) { width: 96px; }
        .markdown-body.summary-report table.rt-table th:nth-child(5) { width: 64px; }
        .markdown-body.summary-report tbody tr,
        .markdown-body.summary-report tbody tr:nth-child(2n) {
            background-color: transparent;
        }
        .markdown-body.summary-report tbody tr.row-hall {
            background-color: #fff5f5;
        }
        .markdown-body.summary-report tbody tr.row-error {
            background-color: #fafafa;
        }
        .markdown-body.summary-report table.rt-table td:nth-child(1) {
            color: #8c8c8c;
            font-family: Consolas, Menlo, monospace;
        }
        .markdown-body.summary-report table.rt-table td:nth-child(3) {
            text-align: center;
            color: #389e0d;
        }
        .markdown-body.summary-report table.rt-table tr.row-hall td:nth-child(3) {
            color: #cf1322;
            font-weight: 600;
        }
        .markdown-body.summary-report table.rt-table tr.row-error td:nth-child(3) {
            color: #8c8c8c;
            font-weight: 400;
        }
        .markdown-body.summary-report table.rt-table tr.risk-p0 td:nth-child(5) { color: #cf1322; font-weight: 600; }
        .markdown-body.summary-report table.rt-table tr.risk-p1 td:nth-child(5) { color: #d46b08; font-weight: 600; }
        .markdown-body.summary-report table.rt-table tr.risk-p2 td:nth-child(5) { color: #0958d9; font-weight: 600; }
        .modal-mask {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        .modal-mask.show {
            display: flex;
        }
        .modal-card {
            width: 420px;
            max-width: calc(100vw - 32px);
            background: #ffffff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.18);
        }
        .modal-title {
            font-size: 17px;
            font-weight: 600;
            color: #222;
            margin-bottom: 10px;
        }
        .modal-desc {
            font-size: 13px;
            color: #666;
            line-height: 1.7;
            margin-bottom: 14px;
        }
        .modal-file-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
        }
        .modal-file-row button {
            padding: 8px 14px;
            font-size: 14px;
        }
        .modal-file-name {
            font-size: 13px;
            color: #888;
            word-break: break-all;
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        .modal-actions .btn-ghost {
            background: #f2f3f5;
            color: #333;
        }
        .modal-actions .btn-ghost:active {
            background: #e5e6eb;
        }
        .input-area {
            display: flex;
            gap:8px;
        }
        #queryInput {
            flex: 1;
            padding:12px 14px;
            border:1px solid #dcdfe6;
            border-radius: 8px;
            font-size:15px;
            outline: none;
        }
        #queryInput:focus {
            border-color:#1677ff;
        }
        button {
            padding: 12px 18px;
            background-color:#1677ff;
            color:#fff;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-size:15px;
            white-space: nowrap;
        }
        button:active {
            background-color:#0e5cc9;
        }
        button:disabled {
            background:#94bfff;
            cursor:not-allowed;
        }

        /* 大屏适配 */
        @media (min-width: 1440px) {
            .chat-wrap {
                max-width: 1280px;
            }
            .chat-box {
                min-height: 560px;
                max-height: 72vh;
            }
        }
        /* 小屏适配 */
        @media (max-width: 768px) {
            body {
                padding: 8px;
            }
            .chat-title {
                font-size: 18px;
                margin-bottom: 12px;
            }
            .chat-box {
                padding: 12px;
                min-height: 420px;
                max-height: 62vh;
            }
            .msg-bubble-user,
            .msg-bubble-ai {
                max-width: 88%;
            }
            .input-area {
                gap: 6px;
            }
            #queryInput {
                padding: 10px 12px;
                font-size: 16px;
            }
            button {
                padding: 10px 14px;
                font-size: 14px;
            }
            .batch-status {
                font-size: 12px;
            }
            .result-link {
                margin-left: 0;
            }
            .msg-bubble-ai.summary-report {
                padding: 14px 12px;
            }
            .markdown-body.summary-report table.rt-table {
                min-width: 560px;
                font-size: 12px;
            }
            .markdown-body.summary-report table.ov-table {
                font-size: 12px;
            }
            .markdown-body.summary-report table.rt-table th:nth-child(1) { width: 48px; }
            .markdown-body.summary-report table.rt-table th:nth-child(3) { width: 60px; }
            .markdown-body.summary-report table.rt-table th:nth-child(4) { width: 72px; }
            .markdown-body.summary-report table.rt-table th:nth-child(5) { width: 52px; }
        }
        @media (max-width: 480px) {
            .msg-bubble-user,
            .msg-bubble-ai {
                max-width: 92%;
            }
            .msg-bubble-ai.summary-report {
                max-width: 100%;
            }
            .markdown-body.summary-report {
                padding: 12px 10px;
            }
        }
    </style>
</head>
<body>
<div class="chat-wrap">
    <div class="chat-title">客服回复幻觉检测</div>
    <div class="batch-bar">
        <button id="batchBtn" onclick="openBatchModal()">批量检测</button>
        <span class="batch-status" id="batchStatus">点击「批量检测」可上传待检查数据，未上传则检测默认样本 task4_replies.json</span>
        <a class="result-link" href="/api/detect/result/latest">下载报告(.md)</a>
        <input type="file" id="batchFile" accept=".json,application/json" style="display:none" onchange="onBatchFileChange()">
    </div>

    <!-- 批量检测弹窗：提醒上传待检查文件，未上传则检测默认文件 -->
    <div class="modal-mask" id="batchModal">
        <div class="modal-card">
            <div class="modal-title">批量检测</div>
            <div class="modal-desc">请选择待检查的数据文件（JSON 数组，结构同 task4_replies.json）。<br>未选择文件时，将检测默认文件 task4_replies.json。</div>
            <div class="modal-file-row">
                <button type="button" onclick="document.getElementById('batchFile').click()">选择文件</button>
                <span class="modal-file-name" id="modalFileName">未选择文件</span>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-ghost" onclick="closeBatchModal()">取消</button>
                <button type="button" id="modalStartBtn" onclick="startBatchFromModal()">检测默认文件</button>
            </div>
        </div>
    </div>
    <div class="chat-box" id="chatBox"></div>
    <div class="input-area">
        <input type="text" id="queryInput" placeholder="请输入单条replies..." />
        <button id="sendBtn" onclick="sendMessage()">检测</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@14.1.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.11.0/lib/core.min.js"></script>

<script>
    marked.setOptions({
        gfm: true,
        breaks: true,
        highlight: function (code, lang) {
            if (lang && hljs.getLanguage(lang)) {
                return hljs.highlight(code, { language: lang }).value;
            }
            return hljs.highlightAuto(code).value;
        }
    });

    function renderMarkdown(mdText) {
        const rawHtml = marked.parse(mdText);
        return DOMPurify.sanitize(rawHtml);
    }

    function scrollBottom(){
        const box = document.getElementById("chatBox");
        box.scrollTop = box.scrollHeight;
    }

    function escapeHtml(str) {
        return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    // 解析单条检测输出（兼容中英文键名），成功时构建中文键值表格 Markdown
    function buildSingleResultMarkdown(text) {
        if (!text) return null;
        const fields = {};
        const keyMap = [
            ["hall", ["是否幻觉", "is_hallucination"]],
            ["type", ["幻觉类型", "hallucination_type"]],
            ["risk", ["风险等级", "风险级别", "risk_level"]],
            ["reason", ["判定依据", "原因", "reason"]]
        ];
        text.split(/\r?\n/).forEach(line => {
            const idx = line.search(/[:：]/);
            if (idx < 0) return;
            const key = line.slice(0, idx).replace(/[\s*`#>"'\-.]/g, "").toLowerCase();
            const val = line.slice(idx + 1).replace(/^[\s*`"']+/, "").replace(/[\s*`"',。;；]+$/, "").trim();
            if (!key || !val) return;
            keyMap.forEach(pair => {
                if (!fields[pair[0]] && pair[1].some(k => key.endsWith(k.toLowerCase()))) fields[pair[0]] = val;
            });
        });
        let hall = null;
        const hallRaw = (fields.hall || "").toLowerCase();
        if (hallRaw === "是" || hallRaw === "true") hall = "是";
        else if (hallRaw === "否" || hallRaw === "false") hall = "否";
        if (!hall) return null;
        const cell = v => (v || "-").replace(/\|/g, "\\|").replace(/\n/g, " ");
        return "#### 检测结果\n\n"
            + "| 项目 | 内容 |\n| --- | --- |\n"
            + `| 是否幻觉 | ${hall} |\n`
            + `| 幻觉类型 | ${cell(fields.type)} |\n`
            + `| 风险等级 | ${cell(fields.risk)} |\n`
            + `| 判定依据 | ${cell(fields.reason)} |\n`;
    }

    // 单条检测卡片装饰：横向滚动容器、结论与风险着色
    function decorateSingleResult(bubble) {
        const table = bubble.querySelector("table");
        if (!table) return;
        const wrap = document.createElement("div");
        wrap.className = "table-scroll";
        table.parentNode.insertBefore(wrap, table);
        wrap.appendChild(table);
        table.classList.add("ov-table");
        table.querySelectorAll("tbody tr").forEach(tr => {
            const cells = tr.children;
            if (cells.length < 2) return;
            const label = cells[0].innerText.trim();
            const td = cells[1];
            const v = td.innerText.trim();
            if (label === "是否幻觉") {
                if (v === "是") td.classList.add("val-hall");
                else if (v === "否") td.classList.add("val-ok");
            } else if (label === "风险等级") {
                if (v === "P0") td.classList.add("val-p0");
                else if (v === "P1") td.classList.add("val-p1");
                else if (v === "P2") td.classList.add("val-p2");
            }
        });
    }

    // 追加用户消息
    function appendUserMsg(text) {
        const box = document.getElementById("chatBox");
        const div = document.createElement("div");
        div.className = "msg-item user-msg";
        div.innerHTML = `<div class="msg-bubble-user">${escapeHtml(text)}</div>`;
        box.appendChild(div);
        scrollBottom();
    }

    async function sendMessage(){
        const input = document.getElementById("queryInput");
        const sendBtn = document.getElementById("sendBtn");
        const msg = input.value.trim();
        if(!msg) return;

        appendUserMsg(msg);
        input.value = "";
        sendBtn.disabled = true;

        // 创建AI消息气泡
        const box = document.getElementById("chatBox");
        const aiWrap = document.createElement("div");
        aiWrap.className = "msg-item ai-msg";
        aiWrap.innerHTML = `<div class="msg-bubble-ai" id="aiCurrent">思考中...</div>`;
        box.appendChild(aiWrap);
        scrollBottom();

        let fullMd = "";
        const aiDom = aiWrap.querySelector("#aiCurrent");
        const es = new EventSource(`/qwen/doChatStream?msg=${encodeURIComponent(msg)}`);

        // 流式分片到达：直接追加原始文本，边收边显示
        es.onmessage = (event) => {
            fullMd += event.data;
            aiDom.innerText = fullMd;
            scrollBottom();
        };

        es.onerror = () => {
            es.close();
            // ✅流全部接收完成，一次性完整渲染markdown；检测结果优先渲染为中文键值卡片
            const singleMd = buildSingleResultMarkdown(fullMd);
            if (singleMd) {
                aiDom.outerHTML = `<div class="msg-bubble-ai markdown-body summary-report">${renderMarkdown(singleMd)}</div>`;
                const bubble = aiWrap.querySelector(".summary-report");
                if (bubble) decorateSingleResult(bubble);
            } else {
                aiDom.outerHTML = `<div class="msg-bubble-ai markdown-body">${renderMarkdown(fullMd)}</div>`;
            }
            sendBtn.disabled = false;
        };
    }

    // ===== 批量检测 =====
    let batchRunning = false;
    let batchFinished = false;
    let batchUploadFile = null;

    // 点击「批量检测」：弹出上传提醒（未上传则检测默认文件）
    function openBatchModal(){
        if (batchRunning) return;
        batchUploadFile = null;
        document.getElementById("batchFile").value = "";
        updateModalFile();
        document.getElementById("batchModal").classList.add("show");
    }

    function closeBatchModal(){
        document.getElementById("batchModal").classList.remove("show");
    }

    // 已选择文件时按钮显示「上传并检测」，否则显示「检测默认文件」
    function updateModalFile(){
        const nameDom = document.getElementById("modalFileName");
        const startBtn = document.getElementById("modalStartBtn");
        if (batchUploadFile) {
            nameDom.innerText = batchUploadFile.name + "（" + (batchUploadFile.size / 1024).toFixed(1) + " KB）";
            nameDom.style.color = "#1677ff";
            startBtn.innerText = "上传并检测";
        } else {
            nameDom.innerText = "未选择文件";
            nameDom.style.color = "#888";
            startBtn.innerText = "检测默认文件";
        }
    }

    function onBatchFileChange(){
        const input = document.getElementById("batchFile");
        batchUploadFile = (input.files && input.files[0]) || null;
        updateModalFile();
    }

    // 弹窗中确认：已选择文件则上传后检测，未选择则检测默认文件
    function startBatchFromModal(){
        closeBatchModal();
        runBatch();
    }

    // 批量检测按钮加载状态切换
    function setBatchLoading(on){
        const btn = document.getElementById("batchBtn");
        btn.disabled = on;
        btn.classList.toggle("is-loading", on);
        btn.innerText = on ? "检测中..." : "批量检测";
    }

    async function runBatch(){
        if(batchRunning) return;
        batchRunning = true;
        batchFinished = false;
        const status = document.getElementById("batchStatus");
        setBatchLoading(true);

        let streamUrl = "/api/detect/batch/stream";
        try {
            if (batchUploadFile) {
                status.innerText = "正在上传待检测数据...";
                const form = new FormData();
                form.append("file", batchUploadFile, batchUploadFile.name);
                const resp = await fetch("/api/detect/upload", { method: "POST", body: form });
                let data = {};
                try { data = await resp.json(); } catch (e) { }
                if (!resp.ok) {
                    throw new Error(data.message || ("上传失败，HTTP " + resp.status));
                }
                status.innerText = `已上传 ${data.sampleCount} 条样本，开始检测...`;
                streamUrl += "?sampleFile=" + encodeURIComponent(data.storedFile);
            } else {
                status.innerText = "未上传文件，检测默认样本 task4_replies.json...";
            }
        } catch (e) {
            batchRunning = false;
            setBatchLoading(false);
            status.innerText = "批量检测失败：" + e.message;
            return;
        }

        const es = new EventSource(streamUrl);
        es.onmessage = (event) => {
            let data;
            try { data = JSON.parse(event.data); } catch (e) { return; }
            if (data.type === "progress") {
                const r = data.result || {};
                let verdict = "检测失败";
                if (r.is_hallucination === true) verdict = "幻觉";
                else if (r.is_hallucination === false) verdict = "正常";
                const percent = data.total ? Math.round(data.completed / data.total * 100) : 0;
                status.innerText = `进度 ${data.completed}/${data.total}（${percent}%）：${r.id} - ${verdict}`;
            } else if (data.type === "done") {
                batchFinished = true;
                batchRunning = false;
                setBatchLoading(false);
                status.innerText = "批量检测完成，结果文件已生成";
                appendBatchSummary(data.report);
            } else if (data.type === "error") {
                batchFinished = true;
                batchRunning = false;
                setBatchLoading(false);
                status.innerText = "批量检测失败：" + data.message;
            }
        };
        es.onerror = () => {
            es.close();
            batchRunning = false;
            setBatchLoading(false);
            if (!batchFinished) {
                status.innerText = "批量检测中断：与服务器的连接已关闭";
            }
        };
    }

    function fmtRatio(value){
        return value == null ? "-" : (value * 100).toFixed(2) + "%";
    }

    // 批量检测完成后，在聊天区追加汇总报告与逐条结果表格
    function appendBatchSummary(report){
        if(!report) return;
        const m = report.metrics;
        let md = "### 批量检测汇总\n\n";
        md += "| 检测概览 | 数值 | 检测指标 | 数值 |\n| --- | --- | --- | --- |\n";
        md += `| 样本总数 | ${report.total} | 精确率 | ${m ? fmtRatio(m.precision) : "-"} |\n`;
        md += `| 检出幻觉 | ${report.hallucination_count} | 召回率 | ${m ? fmtRatio(m.recall) : "-"} |\n`;
        md += `| 调用失败 | ${report.error_count} | F1 | ${m ? fmtRatio(m.f1) : "-"} |\n`;
        md += `| 检测模型 | ${report.model || "-"} | 准确率 | ${m ? fmtRatio(m.accuracy) : "-"} |\n`;
        md += `| 总耗时 | ${((report.duration_ms || 0) / 1000).toFixed(1)} 秒 | | |\n`;
        md += "\n";
        if (report.report_file) {
            md += `报告文件：\`${report.report_file}\`\n\n`;
        }
        md += "| ID | 用户提问 | 是否幻觉 | 类型 | 风险 | 判定依据 |\n| --- | --- | --- | --- | --- | --- |\n";
        (report.results || []).forEach(r => {
            let isHall = "-";
            if (r.is_hallucination === true) isHall = "是";
            else if (r.is_hallucination === false) isHall = "否";
            const question = (r.user_question || "-").replace(/\|/g, "\\|").replace(/\n/g, " ");
            const detail = (r.reason || r.error_message || "-").replace(/\|/g, "\\|").replace(/\n/g, " ");
            md += `| ${r.id} | ${question} | ${isHall} | ${r.hallucination_type || "-"} | ${r.risk_level || "-"} | ${detail} |\n`;
        });

        const box = document.getElementById("chatBox");
        const div = document.createElement("div");
        div.className = "msg-item ai-msg";
        div.innerHTML = `<div class="msg-bubble-ai markdown-body summary-report">${renderMarkdown(md)}</div>`;
        decorateSummaryTable(div);
        box.appendChild(div);
        scrollBottom();
    }

    // 汇总表格装饰：区分概览/结果表，包横向滚动容器，结果表执行幻觉/失败行高亮、风险与结论着色、长文本悬停提示
    function decorateSummaryTable(root){
        const tables = root.querySelectorAll("table");
        if (!tables.length) return;
        tables.forEach(table => {
            const headTh = table.querySelector("thead th");
            const isResult = !!headTh && headTh.innerText.trim() === "ID";
            table.classList.add(isResult ? "rt-table" : "ov-table");
            const wrap = document.createElement("div");
            wrap.className = "table-scroll";
            table.parentNode.insertBefore(wrap, table);
            wrap.appendChild(table);
            if (!isResult) return;
            table.querySelectorAll("tbody tr").forEach(tr => {
                const cells = tr.children;
                if (cells.length < 6) return;
                const verdict = cells[2].innerText.trim();
                const risk = cells[4].innerText.trim();
                if (verdict === "是") tr.classList.add("row-hall");
                else if (verdict === "检测失败") tr.classList.add("row-error");
                if (risk === "P0") tr.classList.add("risk-p0");
                else if (risk === "P1") tr.classList.add("risk-p1");
                else if (risk === "P2") tr.classList.add("risk-p2");
                // 用户提问 / 判定依据列文本过长时，悬停可查看完整内容
                [1, 5].forEach(i => {
                    const td = cells[i];
                    if (td && td.innerText.length > 40) td.title = td.innerText;
                });
            });
        });
    }

    document.getElementById("queryInput").addEventListener("keydown",function(e){
        if(e.key === "Enter") sendMessage();
    })

    // 点击弹窗遮罩关闭弹窗
    document.getElementById("batchModal").addEventListener("click", function(e){
        if (e.target === this) closeBatchModal();
    });
</script>
</body>
